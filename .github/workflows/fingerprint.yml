name: Build optional fingerprint latency fix
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fingerprint.yml
      - scripts/omarchy/build-fingerprint.sh
      - patches/fpc1553-report-match-immediately.patch
      - tests/fingerprint-driver.py
  pull_request:
    paths:
      - .github/workflows/fingerprint.yml
      - scripts/omarchy/build-fingerprint.sh
      - patches/fpc1553-report-match-immediately.patch
      - tests/fingerprint-driver.py
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential meson ninja-build pkg-config libglib2.0-dev libgusb-dev libgudev-1.0-dev libpixman-1-dev libssl-dev libgirepository1.0-dev patchelf
      - name: Test and build pinned driver
        run: bash scripts/omarchy/build-fingerprint.sh output
      - uses: actions/upload-artifact@v7
        with:
          name: fpc1553-immediate-match-aarch64
          path: output/libfprint-2.so.2.0.0
