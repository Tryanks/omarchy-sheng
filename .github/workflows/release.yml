name: Package single and dual boot release
on:
  workflow_dispatch:
    inputs:
      dual_run:
        description: Successful dual (linux) rootfs workflow run ID
        required: true
        type: string
      single_run:
        description: Successful single (userdata) rootfs workflow run ID
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        default: v0.1.0-preview.2
        type: string
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DUAL_RUN: ${{ inputs.dual_run }}
      SINGLE_RUN: ${{ inputs.single_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Assemble verified bundles
        shell: bash
        run: |
          set -euo pipefail
          [[ $DUAL_RUN =~ ^[0-9]+$ && $SINGLE_RUN =~ ^[0-9]+$ ]]
          [[ $RELEASE_TAG =~ ^[a-zA-Z0-9._-]+$ ]]
          mkdir release
          for mode in dual single; do
            if [[ $mode == dual ]]; then run=$DUAL_RUN; label=linux; else run=$SINGLE_RUN; label=userdata; fi
            [[ $(gh run view "$run" --json conclusion -q .conclusion) == success ]]
            mkdir work
            gh run download "$run" -n "rootfs-arch-Omarchy-$label" -D work
            gh run download "$run" -n "boot-arch-Omarchy-$label" -D work
            (cd work && sha256sum -c SHA256SUMS)
            # Apply the reviewed device overlay to both layouts. No services
            # are started and no boot/kernel bytes are changed in this stage.
            mkdir work/mount
            trap 'sudo umount work/mount/proc work/mount/dev work/mount 2>/dev/null || true' EXIT
            sudo mount -o loop work/rootfs.img work/mount
            sudo install -m755 scripts/omarchy/verify.sh work/mount/usr/local/lib/omarchy-sheng/verify.sh
            sudo install -m755 scripts/omarchy/verify-power.py scripts/omarchy/preserve-system.sh work/mount/usr/local/lib/omarchy-sheng/
            sudo install -m644 scripts/omarchy/session.lua work/mount/usr/local/lib/omarchy-sheng/session.lua
            sudo python3 scripts/omarchy/configure-power.py work/mount
            sudo mount --bind /dev work/mount/dev
            sudo mount -t proc proc work/mount/proc
            sudo chroot work/mount env -u XDG_RUNTIME_DIR /usr/local/lib/omarchy-sheng/verify.sh
            sudo umount work/mount/proc work/mount/dev work/mount
            trap - EXIT
            sudo e2fsck -fn work/rootfs.img
            prefix="omarchy-sheng-$mode"
            zstd -T0 -6 work/rootfs.img -o "release/$prefix-rootfs.img.zst"
            cp work/boot.img "release/$prefix-boot.img"
            cp work/packages.txt "release/$prefix-packages.txt"
            gh run view "$run" --json headSha,url | jq --arg sha "$GITHUB_SHA" \
              '. + {releaseOverlaySha: $sha, overlay: "sheng-power-lock-v1", overlayFiles: ["/usr/local/lib/omarchy-sheng/verify.sh", "/usr/local/lib/omarchy-sheng/verify-power.py", "/usr/local/lib/omarchy-sheng/preserve-system.sh", "/usr/local/lib/omarchy-sheng/session.lua", "/usr/local/lib/omarchy-sheng/lid.sh", "/usr/local/lib/omarchy-sheng/fingerprint-ui.py", "/usr/local/lib/omarchy-sheng/fingerprint-auth.py", "/usr/local/lib/omarchy-sheng/fingerprint_ops.py", "/usr/local/bin/omarchy-setup-security-fingerprint", "/usr/local/share/applications/omarchy-sheng-fingerprint.desktop", "/etc/polkit-1/rules.d/00-omarchy-sheng-admin.rules", "/etc/pam.d/omarchy-lock-password", "/etc/systemd/logind.conf.d/60-omarchy-sheng.conf", "/etc/systemd/sleep.conf.d/60-omarchy-sheng.conf", "/etc/UPower/UPower.conf", "/etc/systemd/system/sysinit.target.wants/xiaomi-charger-mode.service"]}' \
              > "release/$prefix-source.json"
            # GitHub limits individual assets to 2 GiB. Split large compressed images.
            if (( $(stat -c%s "release/$prefix-rootfs.img.zst") > 1900000000 )); then
              split -b 1900000000 -d "release/$prefix-rootfs.img.zst" "release/$prefix-rootfs.img.zst.part-"
              rm "release/$prefix-rootfs.img.zst"
            fi
            rm -rf work
          done
          cp docs/install.md release/INSTALL.md
          (cd release && sha256sum ./* > SHA256SUMS)
      - name: Create draft prerelease
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null); then
            [[ $draft == true ]] || { echo 'Refusing to replace a published release'; exit 1; }
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file docs/release-notes.md
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Omarchy sheng $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
